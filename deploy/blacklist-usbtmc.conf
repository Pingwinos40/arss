# Keep the kernel usbtmc driver off USB-TMC instruments so libusb (pyusb,
# used by the pyvisa-py backend) can claim the BK894 without contention.
# Install: sudo cp deploy/blacklist-usbtmc.conf /etc/modprobe.d/
#          sudo modprobe -r usbtmc
# This also removes /dev/usbtmc* nodes for every USB-TMC device on the Pi.
blacklist usbtmc
